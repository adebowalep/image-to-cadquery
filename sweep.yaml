# Weights & Biases hyperparameter sweep over scripts/train.py.
#
# Usage:
#   uv sync --extra tracking   # installs wandb
#   wandb sweep sweep.yaml     # prints a sweep id
#   wandb agent <sweep_id>     # run as many agents/machines as you like against it
#
# Parameter keys must exactly match scripts/train.py's CLI flags (minus the leading
# `--`), since the wandb agent invokes `python scripts/train.py --<key> <value> ...`.
program: scripts/train.py
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  weight-decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  batch-size:
    values: [16, 32, 64]
  embed-dim:
    values: [256, 512, 768]
  n-layers:
    values: [2, 4, 6]
  n-heads:
    values: [4, 8]
  ff-dim:
    values: [512, 1024, 2048]
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
command:
  - ${env}
  - python
  - ${program}
  - --wandb
  - --epochs
  - "5"
  - ${args}
